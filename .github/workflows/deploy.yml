name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # This specifies that the action will run on pushes to the main branch.

jobs:
  build:
    runs-on: ubuntu-latest  # The action will run on the latest version of Ubuntu.

    steps:
    - name: Checkout code
      uses: actions/checkout@v2  # This action checks out your repository.

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}  # This token allows GitHub Actions to deploy to GitHub Pages.
        publish_dir: ./  # The directory to deploy (in this case, the root directory).
